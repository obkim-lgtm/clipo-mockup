<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="output/clipo_favicon.png">
<title>CLIPO Mockup — 목업 목록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-gov.min.css">
<style>
*{font-family:'Pretendard GOV',-apple-system,sans-serif;box-sizing:border-box;margin:0;padding:0}
body{background:#f6f7f9;min-height:100vh;padding:44px 40px;color:#222631}
.wrap{max-width:900px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.badge{background:#416bff;color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px}
h1{font-size:24px;font-weight:700;margin-bottom:6px}
.sub{font-size:15px;color:#6d7381;margin-bottom:26px;line-height:1.6}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:20px}
.search{flex:1;height:44px;border:1px solid #d9d9d9;border-radius:8px;padding:0 14px;font-size:16px;font-family:inherit;background:#fff}
.search:focus{outline:none;border-color:#416bff}
.count{font-size:14px;color:#6d7381;white-space:nowrap}
.list{background:#fff;border:1px solid #e7e9ec;border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid #f1f3f5;text-decoration:none;color:inherit}
.row:last-child{border-bottom:none}
.row:hover{background:#f4f8ff}
.nm{flex:1;min-width:0;font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt{font-size:14px;color:#9aa0ad;flex-shrink:0}
.new{font-size:11px;font-weight:700;color:#fff;background:#416bff;padding:2px 6px;border-radius:4px;flex-shrink:0}
.msg{padding:28px 18px;font-size:15px;color:#6d7381;line-height:1.7}
.msg a{color:#365eef;font-weight:600}
footer{margin-top:34px;font-size:14px;color:#9aa0ad;line-height:1.8}
footer a{color:#6d7381}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <svg width="60" height="13" viewBox="0 0 76 16" fill="none"><path d="M11.3613 4.03516H4.09668V11.9629H8.88281L8.88086 11.9648H15.6016V16H4.02539C1.80242 15.9998 0 14.223 0 12.0322V3.96777C0 1.77696 1.80242 0.000177874 4.02539 0H15.4561L11.3613 4.03516ZM22.0703 11.9648H33.5781V16H22.002C19.7788 16 17.9756 14.2231 17.9756 12.0322V0H22.0703V11.9648ZM40.0459 16H35.9521V0H40.0459V16ZM54.5381 0C56.4564 0 58.0138 1.53228 58.0186 3.42285L58.0166 3.4248V8.54297C58.014 10.4333 56.4567 11.9648 54.5361 11.9648H46.5107L42.416 16V0H54.5381ZM71.9746 0C74.0086 0.000134956 75.6887 1.49046 75.958 3.42285H76V12.5771H75.958C75.6887 14.5095 74.011 15.9999 71.9746 16H64.4238C62.3897 16 60.7098 14.5096 60.4404 12.5771C60.4145 12.398 60.3984 12.2184 60.3984 12.0322V3.96777C60.3984 3.78159 60.4145 3.60205 60.4404 3.42285C60.7098 1.49037 62.3873 0 64.4238 0H71.9746ZM64.4922 12.5771H71.9062V3.42285H64.4922V12.5771ZM46.5107 3.42285V8.54004H53.9238V3.42285H46.5107Z" fill="#365EEF"/></svg>
    <span class="badge">Mockup</span>
  </div>
  <h1>CLIPO 목업 목록</h1>
  <p class="sub">최근에 만든 순서로 표시돼요. 파일명을 검색해 바로 열 수 있어요.</p>

  <div class="tools">
    <input class="search" id="q" placeholder="파일명 검색 (예: teacher_verify, ocr, creative)" oninput="render()">
    <span class="count" id="count"></span>
  </div>

  <div class="list" id="list"><div class="msg">목록을 불러오는 중…</div></div>

  <footer>
    이전 랜딩(창의적 체험활동 인덱스) → <a href="creative_index_260515.html">creative_index_260515.html</a><br>
    까망이 허브 → <a href="output/kkamangi_hub_260704.html">output/kkamangi_hub_260704.html</a>
  </footer>
</div>

<script>
/* 로컬 미리보기 서버(python http.server)는 index.html이 없는 디렉토리에 대해
   자동 목록 HTML을 반환한다 → 그걸 파싱해서 항상 최신 목록을 보여준다.
   GitHub Pages에는 디렉토리 목록이 없으므로 안내 문구로 대체된다. */
var FILES = [];

fetch('output/')
  .then(function(r){ if(!r.ok) throw new Error('no listing'); return r.text(); })
  .then(function(html){
    var doc = new DOMParser().parseFromString(html, 'text/html');
    FILES = Array.prototype.map.call(doc.querySelectorAll('a'), function(a){
        return decodeURIComponent(a.getAttribute('href') || '');
      })
      .filter(function(h){ return /\.html$/i.test(h) && h.indexOf('/') === -1; })
      .map(function(name){
        var m = name.match(/_(\d{6})\.html$/);       // 파일명 끝 _YYMMDD
        return { name:name, date: m ? m[1] : '' };
      })
      .sort(function(a, b){
        if (a.date !== b.date) return b.date.localeCompare(a.date);  // 최신 먼저
        return a.name.localeCompare(b.name);
      });
    render();
  })
  .catch(function(){
    document.getElementById('list').innerHTML =
      '<div class="msg">이 페이지는 <b>로컬 미리보기 전용 목록</b>이에요. 배포 환경에서는 파일 목록을 만들 수 없어요.<br>' +
      '목업은 <code>output/&lt;파일명&gt;.html</code> 주소로 직접 열어주세요.</div>';
    document.getElementById('count').textContent = '';
  });

function fmtDate(d){
  if (!d) return '';
  return '20' + d.slice(0,2) + '.' + d.slice(2,4) + '.' + d.slice(4,6);
}

function render(){
  var q = document.getElementById('q').value.trim().toLowerCase();
  var rows = FILES.filter(function(f){ return !q || f.name.toLowerCase().indexOf(q) !== -1; });
  var newest = FILES.length ? FILES[0].date : '';
  document.getElementById('count').textContent = rows.length + ' / ' + FILES.length + '개';
  document.getElementById('list').innerHTML = rows.length
    ? rows.map(function(f){
        return '<a class="row" href="output/' + f.name + '">'
          + '<span class="nm">' + f.name.replace(/\.html$/, '') + '</span>'
          + (f.date && f.date === newest ? '<span class="new">NEW</span>' : '')
          + '<span class="dt">' + fmtDate(f.date) + '</span>'
          + '</a>';
      }).join('')
    : '<div class="msg">검색 결과가 없어요.</div>';
}
</script>
</body>
</html>
